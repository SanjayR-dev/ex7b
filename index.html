<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Our Website</title>
    <style>
        /* Reset default browser styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Center content on the screen with a modern gradient background */
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        /* Main welcome card container */
        .welcome-card {
            background-color: #ffffff;
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        .welcome-card h1 {
            font-size: 2.5rem;
            color: #2d3748;
            margin-bottom: 15px;
        }

        .welcome-card p {
            font-size: 1.1rem;
            color: #718096;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Call-to-action button */
        .cta-button {
            display: inline-block;
            background-color: #667eea;
            color: #ffffff;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .cta-button:hover {
            background-color: #5a67d8;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<main class="welcome-card">
    <h1>Welcome!!</h1>
    <p>We're thrilled to have you here. Explore our platform to discover amazing content, tools, and resources tailored just for you.</p>
    <a href="#" class="cta-button">Get Started</a>
</main>

</body>
</html>
